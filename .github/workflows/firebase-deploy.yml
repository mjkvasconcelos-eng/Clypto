name: Deploy Clypto to Firebase

on:
  push:
    branches:
      - main
      - v2.1-functional-panel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy Hosting and Functions
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: clypto-adf95
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLYPTO_ADF95 }}
          projectId: clypto-adf95
          channelId: live

      - name: Deploy Firestore rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project clypto-adf95
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLYPTO_ADF95 }}' > "$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools@latest deploy --only firestore:rules --project clypto-adf95
